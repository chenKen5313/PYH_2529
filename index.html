/* ── RealMap Component ── */
function RealMap({items,selected,onSelect}) {
  const host = useRef(null);
  useEffect(() => {
    let cancelled = false;
    let map;
    if (!host.current) return;
    const L = window.L;
    if (!L) { host.current.innerHTML = '<div class="map-error">地图加载失败，请检查网络后刷新</div>'; return; }
    map = L.map(host.current, {zoomControl:true, scrollWheelZoom:false, attributionControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap contributors'}).addTo(map);
    const points = items.map(s => coordinates[s.id]).filter(Boolean);
    if (points.length > 1) {
      L.polyline(points, {color:'#ef6b3a', weight:4, opacity:.9, dashArray:'9 8'}).addTo(map);
    }
    items.forEach(s => {
      const coord = coordinates[s.id];
      if (!coord) return;
      const active = s.id === selected;
      const icon = L.divIcon({
        className: 'map-pin-shell',
        html: '<button class="real-pin'+(active?' is-active':'')+'" aria-label="'+s.name+'"><b>'+s.order+'</b><span>'+s.name+'</span></button>',
        iconSize: [130,50], iconAnchor: [18,18]
      });
      L.marker(coord, {icon, title:s.name}).addTo(map).on('click', () => onSelect(s.id));
    });
    if (points.length === 1) map.setView(points[0], 13);
    else if (points.length > 1) map.fitBounds(L.latLngBounds(points), {padding:[42,42], maxZoom:13});
    setTimeout(() => map?.invalidateSize(), 80);
    return () => { cancelled = true; if (map) map.remove(); };
  }, [items, selected, onSelect]);
  return html`<div class="realMapWrap"><div class="realMapHead"><span>真实地理路线 · DAY ${items[0]?.day}</span><small>拖动地图 · 点击编号查看详情</small></div><div ref=${host} class="realMap"/></div>`;
}
